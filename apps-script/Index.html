  /* ---------------------------------------------------------------- */
  /* Historial (cerrados y desestimados)                              */
  /* ---------------------------------------------------------------- */
  let HIS=null;
  const HF={ q:"", estado:"", urgencia:"", rubro:"", proveedor:"", desde:"", hasta:"" };
  function verHistorial(){
    $("#main").innerHTML='<div class="card vacio">Cargando el historial…</div>';
    server("getHistorial").then(res=>{ if(VISTA!=="historial") return; HIS=res.reclamos;
      $("#main").innerHTML=`
        <div class="rowsb"><h1>Historial</h1><button type="button" class="b2" id="hExp">Exportar a planilla lo filtrado</button></div>
        <div class="filtros">
          <div class="f q"><label class="l" for="hq">Buscar</label><input id="hq" class="i" type="search" placeholder="ID de propiedad, dirección o N° de reclamo" value="${esc(HF.q)}"></div>
          ${sel("hEst","Estado",opts([{v:"cerrado",t:"Cerrados"},{v:"desestimado",t:"Desestimados"}],HF.estado,"Todos"))}
          ${sel("hUrg","Urgencia",opts([5,4,3,2,1],HF.urgencia,"Todas"))}
          ${sel("hRub","Rubro",opts(RUBROS.map(r=>({v:r.id_rubro,t:r.nombre})),HF.rubro,"Todos"))}
          ${sel("hProv","Proveedor",opts(PROVS.map(p=>({v:p.id_proveedor,t:p.nombre})),HF.proveedor,"Todos"))}
          ${fec("hDesde","Desde",HF.desde)}${fec("hHasta","Hasta",HF.hasta)}
        </div>
        <div class="m" id="hCant"></div>
        <div class="card tw t-his"><div role="table" aria-label="Historial de reclamos" id="hTabla"></div></div>`;
      $("#hq").oninput=e=>{ HF.q=e.target.value; pintarHistorial(); };
      [["hEst","estado"],["hUrg","urgencia"],["hRub","rubro"],["hProv","proveedor"],["hDesde","desde"],["hHasta","hasta"]].forEach(([id,k])=>{ $("#"+id).onchange=e=>{ HF[k]=e.target.value; pintarHistorial(); }; });
      $("#hTabla").onclick=e=>{ const f=e.target.closest(".bd"); if(f) ir("ficha", f.dataset.id); };
      $("#hExp").onclick=async()=>{
        const ids=historialFiltrado().map(r=>r.id_reclamo); if(!ids.length){ toast("No hay reclamos para exportar con esos filtros.", true); return; }
        busy(true,"Armando la planilla…");
        try{ const x=await server("exportarHistorial", ids); busy(false);
          const el=modal(`<h2>Exportación lista</h2><div>${plural(x.cantidad,"reclamo exportado","reclamos exportados")}.</div><div><a href="${esc(x.url)}" target="_blank" rel="noopener"><b>Abrir la planilla</b></a></div><div class="btns"><button type="button" class="b2" data-a="no">Cerrar</button></div>`);
          el.addEventListener("click", e=>{ if(e.target.dataset.a) el.cerrar(); });
        }catch(err){ fallo(err); }
      };
      pintarHistorial();
    }).catch(fallo);
  }
  const fechaFin = r => r.estado==="cerrado" ? r.fecha_cierre : r.desest_fecha;
  function historialFiltrado(){
    const q=norm(HF.q);
    return HIS.filter(r=>{
      if(HF.estado && r.estado!==HF.estado) return false;
      if(HF.urgencia && String(r.urgencia)!==HF.urgencia) return false;
      if(HF.rubro && r.rubro_id!==HF.rubro) return false;
      if(HF.proveedor && r.proveedor_id!==HF.proveedor) return false;
      if(HF.desde && fechaFin(r)<HF.desde) return false;
      if(HF.hasta && fechaFin(r)>HF.hasta) return false;
      if(q && norm(r.id_reclamo+" "+pad4(r.id_propiedad)+" "+r.direccion).indexOf(q)===-1) return false;
      return true;
    });
  }
  function pintarHistorial(){
    const l=historialFiltrado();
    $("#hCant").textContent=plural(l.length,"reclamo","reclamos")+(l.length!==HIS.length?" de "+HIS.length:"");
    $("#hTabla").innerHTML=`<div role="row" class="row hd">${["N°","Propiedad","Rubro","Urg.","Estado","Proveedor","Fecha","Costo final","Días"].map(t=>`<div role="columnheader" class="th">${t}</div>`).join("")}</div>`+
      (l.map(r=>`<div role="row" class="row bd" data-id="${esc(r.id_reclamo)}">
        <div role="cell"><b style="color:var(--blue)">${esc(r.id_reclamo)}</b></div>
        <div role="cell"><div style="font-weight:600">${pad4(r.id_propiedad)}</div><div class="m">${esc(r.direccion)}</div></div>
        <div role="cell" class="${r.rubro?"":"m"}">${esc(r.rubro||"Sin evaluar")}</div><div role="cell">${urg(r.urgencia)}</div>
        <div role="cell">${r.estado==="cerrado"?'<span class="p pok">Cerrado</span>':`<span class="p pw" title="${esc(r.desest_motivo)}">Desestimado</span>`}</div>
        <div role="cell" class="${r.proveedor?"":"m"}">${esc(r.proveedor||"—")}</div>
        <div role="cell">${fechaAr(fechaFin(r))}</div><div role="cell">${pesos(r.costo_final)||'<span class="m">—</span>'}</div><div role="cell">${r.dias_abierto}</div></div>`).join("")
        || `<div class="vacio">${HIS.length?"Ningún reclamo coincide con los filtros.":"Todavía no hay reclamos cerrados ni desestimados."}</div>`);
  }

  /* ---------------------------------------------------------------- */
  /* Supervisión                                                      */
  /* ---------------------------------------------------------------- */
  function verSupervision(){
    $("#main").innerHTML='<div class="card vacio">Calculando…</div>';
    server("getSupervision").then(s=>{ if(VISTA!=="supervision") return;
      const dec=n=>n===""?"—":String(n).replace(".",",");
      const barra=(n,max)=>`<div class="hb" style="width:${max?Math.max(2,Math.round(n/max*100)):0}%"></div>`;
      const tabla=(titulo,cab,filas,vacio)=>`<div class="card pad"><h2 style="margin-bottom:10px">${titulo}</h2>${filas.length?`<div class="tw"><table class="t"><thead><tr>${cab.map((c,i)=>`<th${i?' class="num"':""}>${c}</th>`).join("")}</tr></thead><tbody>${filas.map(f=>`<tr>${f.map((c,i)=>`<td${i?' class="num"':""}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:`<div class="m">${vacio||"Sin datos todavía."}</div>`}</div>`;
      const maxE=Math.max.apply(null, s.porEtapa.map(e=>e.cantidad).concat([1]));
      const maxM=Math.max.apply(null, s.porMes.map(m=>Math.max(m.ingresados,m.cerrados)).concat([1]));
      $("#main").innerHTML=`
        <h1>Supervisión</h1>
        <div class="kpi">
          <div><span>Abiertos</span><b>${s.resumen.abiertos}</b></div><div><span>Cerrados</span><b>${s.resumen.cerrados}</b></div>
          <div><span>Desestimados</span><b>${s.resumen.desestimados}</b></div><div><span>Días promedio de punta a punta</span><b>${dec(s.resumen.punta_a_punta)}</b></div>
        </div>
        <div class="two">
          <div class="card pad"><h2 style="margin-bottom:10px">Reclamos abiertos por etapa</h2><table class="t"><tbody>${s.porEtapa.map(e=>`<tr><td style="width:150px">${esc(e.etapa)}</td><td>${barra(e.cantidad,maxE)}</td><td class="num" style="width:50px">${e.cantidad}</td></tr>`).join("")}</tbody></table></div>
          ${tabla("Tiempo promedio por etapa",["Tramo","Días","Casos"],s.porTramo.map(t=>[esc(t.tramo),dec(t.dias),t.casos]))}
          ${tabla("De punta a punta y costo, por rubro",["Rubro","Días","Cerrados","Costo total"],s.porRubro.map(t=>[esc(t.nombre),dec(t.dias),t.casos,pesos(t.costo)||"$ 0"]),"Todavía no hay reclamos cerrados.")}
          ${tabla("De punta a punta, por urgencia",["Urgencia","Días","Cerrados"],s.porUrgencia.map(t=>[esc(t.nombre),dec(t.dias),t.casos]),"Todavía no hay reclamos cerrados.")}
        </div>
        <div class="card pad"><h2 style="margin-bottom:10px">Ingresados, cerrados y costo por mes</h2><div class="tw"><table class="t"><thead><tr><th>Mes</th><th>Ingresados</th><th></th><th>Cerrados</th><th></th><th class="num">Costo total</th></tr></thead>
          <tbody>${s.porMes.map(m=>`<tr><td>${m.mes}</td><td style="width:50px">${m.ingresados}</td><td style="min-width:90px">${barra(m.ingresados,maxM)}</td><td style="width:50px">${m.cerrados}</td><td style="min-width:90px">${barra(m.cerrados,maxM)}</td><td class="num">${pesos(m.costo)||"$ 0"}</td></tr>`).join("")}</tbody></table></div></div>
        <div class="two">
          ${tabla("Ranking de proveedores",["Proveedor","Calif.","Realizados","En curso","Reaperturas","Demoras","Monto total"],s.ranking.map(p=>[esc(p.nombre)+(p.estado==="baja"?' <span class="p pi">De baja</span>':""),p.calificacion===""?"—":dec(p.calificacion)+" ★",p.realizados,p.en_curso,p.reaperturas,p.demoras,pesos(p.monto_total)||"$ 0"]),"Todavía no hay trabajos asignados.")}
          ${tabla("Propiedades con más reclamos",["Propiedad","Reclamos","Abiertos"],s.propiedades.map(p=>["<b>"+pad4(p.id)+"</b> · "+esc(p.direccion),p.total,p.abiertos]))}
        </div>
        <div class="m">Los reclamos desestimados no cuentan en estas métricas.</div>`;
    }).catch(fallo);
  }

  arrancar();
})();
</script>
</body>
</html>
